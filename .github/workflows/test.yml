name: tests

on:
  push:
    branches: ['**']  # Branch commits are checked; version tags reuse those results.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A second branch pointing at this commit waits for the first run, then reuses
# its successful result. Never cancel a check HQ may currently be waiting for.
concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reuse:
    # Internal PRs already have a push check. Forks need their PR merge check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.existing.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check for an existing successful verification
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/reuse_tests.py

  test:
    needs: reuse
    if: needs.reuse.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # Windows process and Git-heavy tests need longer than the Linux runners.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install package and dependencies
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests-py -v
