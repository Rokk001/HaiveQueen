name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing full-version tag to publish
        required: true
        type: string
      source_tag:
        description: Prerelease whose verified assets are promoted
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' && contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install "setuptools==80.9.0"
      - name: Set package version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([A-Za-z0-9]+(?:-[A-Za-z0-9]+)*)\.(0|[1-9]\d*))?', tag)
          if not match:
              raise SystemExit('Unsupported release tag: ' + tag)
          version = tag[1:]
          postfix, number = match.group(4, 5)
          if postfix and postfix.lower() not in ('alpha', 'beta', 'rc', 'dev'):
              # Arbitrary tag postfixes need a PEP 440-compatible package version.
              version = '.'.join(match.group(1, 2, 3)) + '.dev' + number + '+' + postfix
          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^version = "[^"]+"$', 'version = "' + version + '"', text, count=1)
          if count != 1:
              raise SystemExit('Package version not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build distributions
        run: |
          python -c "import setuptools.build_meta; setuptools.build_meta.build_sdist('dist')"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Publish release and distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${prerelease[@]}" || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

  full-release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    concurrency:
      group: full-release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Identify maintenance tags
        id: tag-kind
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          EXPLICIT_PROMOTION: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          kind = subprocess.check_output(['git', 'cat-file', '-t', 'refs/tags/' + tag], text=True).strip()
          # Maintenance pushes use lightweight tags; promotion creates annotated tags.
          publish = kind == 'tag' or os.environ.get('EXPLICIT_PROMOTION') == 'true'
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('publish=' + str(publish).lower() + '\n')
          if not publish:
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
                  summary.write('Maintenance tag: code checkpoint only; no release published.\n')
          PY
      - name: Publish full release without rebuilding
        if: steps.tag-kind.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          message=$(git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG")
          source=${SOURCE_TAG:-${message#HaiveQueen prerelease: }}
          if [[ "$source" == "$message" || ! "$source" =~ ^${RELEASE_TAG//./\.}-[A-Za-z0-9]+(-[A-Za-z0-9]+)*\.(0|[1-9][0-9]*)$ ]]; then
            echo "Full release tag lacks a valid pre-release source" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$source^{commit}")" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]; then
            echo "Pre-release and full release commits differ" >&2
            exit 1
          fi
          if [[ "$(gh release view "$source" --json isPrerelease --jq .isPrerelease)" != true ]]; then
            echo "Source is not a pre-release" >&2
            exit 1
          fi
          mkdir -p dist
          gh release download "$source" --dir dist
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes dist/* || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
