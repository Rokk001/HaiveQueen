# Project settings: <project>\.haivequeen\project.toml
# Main part: the repository, the name, the integration branch, the compile check, the build and the deploy.
name = "example"
integrationBranch = "main"        # empty or missing: the default branch of the repository's remote, else main
compileCheck = ""                 # the command that compiles and tests; empty = no compile check
buildCommand = ""                 # the command that builds the product after the check (run in the plan's worktree); empty = no build
deployCommand = ""                # the command that deploys after the push (run in the plan's worktree); empty = no deploy

# Advanced
plans = ["docs/plans/*.md"]       # plan file patterns, one per entry; an entry starting with ! excludes, e.g. "!docs/plans/archive/**"
colour = "cyan"
priority = 0                      # higher gets a free slot first
worktreeLocation = ""             # folder of new worktrees (relative: from the repository); empty = beside the repository
deleteFinishedWorktrees = true    # remove worktrees whose commits are integrated
deleteIntegratedBranches = false  # delete the plan branch and its sub-branches, local and remote, after the plan is integrated
publishReleases = false           # HaiveQueen publishes a GitHub release at each integration (only for a remote on GitHub)
nextVersion = ""                  # the next version for a bigger step, e.g. "2.1.0"; empty: the last digit counts up
buildProcessNames = ["cl.exe"]    # compiler processes counted in the "active cores" display; empty = no display
ownerTopics = []                  # topics whose questions always go to the owner, e.g. ["pricing", "public wording"]
