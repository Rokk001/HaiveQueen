# Machine settings: %APPDATA%\HaiveQueen\config.toml
slots = 2                 # agent processes shared by all projects
hives = 2                 # maximum Hives with running Queens, machine-wide
preferredProvider = ""    # preferred Queen provider, or empty
excludedProviders = []    # provider names never used
queenClass = "medium"     # project may override
beesPerQueen = 3          # project may override
escalateAfter = 3         # failures per class before escalation
contextLimitTokens = 300000
buildJobs = 0             # 0 = choose automatically
ramReserveMb = 2048       # RAM that must stay free
agentStallSeconds = 3600  # an agent that prints nothing for this long is marked as stalled, never ended (0 = off)
exportDir = "%LOCALAPPDATA%\\HaiveQueen\\exports"

# Interrupted agent ends (laptop sleep, network or API errors, vanished process): the values below are the defaults.
clockJumpSeconds = 120                  # a wall clock jump above this many seconds during an agent run counts as laptop sleep
retryWaitMinutes = [1, 2, 4, 8, 15]     # wait before the 1st, 2nd, ... retry of consecutive API or connection errors of one task; the last value repeats
rateLimitWaitMinutes = 15               # wait after a rate limit when no reset time of the limited provider is known

# Providers: slots = tasks at once (shared by all projects); use = preferred | fallback | capability-only; classes = model and effort per class.
# limit.source says where the weekly usage comes from (claude | codex | none); the scheduler picks the provider with the most weekly limit left per hour.
[[providers]]
name = "claude"
protocol = "claude"
command = "claude"
args = ["--output-format", "stream-json", "--verbose", "--model", "{model}", "--permission-mode", "auto", "--effort", "{effort}", "--add-dir", "{repo}", "--add-dir", "{tools}", "--disable-slash-commands", "--strict-mcp-config", "--tools", "{claudeTools}", "--setting-sources", "", "--append-system-prompt-file", "{rules}"]
slots = 2
use = "preferred"
limit = { source = "claude" }
[providers.classes]
light = { model = "claude-haiku-5-5", effort = "medium" }
medium = { model = "claude-sonnet-5-5", effort = "medium" }
heavy = { model = "claude-opus-5-5", effort = "medium" }

[[providers]]
name = "codex"
protocol = "codex"
command = "codex"
args = ["exec", "--json", "--skip-git-repo-check", "-m", "{model}", "-c", "model_reasoning_effort={effort}", "--dangerously-bypass-approvals-and-sandbox", "--ignore-user-config", "-C", "{cwd}"]
slots = 2
use = "preferred"
capabilities = ["images"]
limit = { source = "codex" }
[providers.classes]
light = { model = "gpt-6-luna", effort = "medium" }
medium = { model = "gpt-6.1-terra", effort = "medium" }
heavy = { model = "gpt-6.1-sol", effort = "medium" }

[[projects]]
name = "example"
workspace = "D:\\work\\example"
