[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestrator"
version = "2.0.0"
description = "Run many Claude Code and Codex agents in parallel, one fresh agent per task."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
orch = "orch:main"

[tool.setuptools]
py-modules = ["orch"]

[tool.setuptools.packages.find]
include = ["orchlib*"]
