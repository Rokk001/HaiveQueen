[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "haivequeen"
version = "2.0.0"
description = "Run many Claude Code and Codex agents in parallel, one fresh agent per task."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
bzz = "haivequeen.cli:main"

[tool.setuptools.packages.find]
include = ["haivequeen*"]
