[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haivequeen"
version = "2.0.0"
description = "Run many Claude Code and Codex agents in parallel, one fresh agent per task."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["tomlkit==0.15.2"]

[project.scripts]
bzz = "haivequeen.cli:main"

[tool.setuptools.packages.find]
include = ["haivequeen*"]

[tool.setuptools.package-data]
haivequeen = ["bee_names.txt", "cli-models.json", "web-client.js", "web-client.css", "web-header.png", "web-icon.png", "web-login-logo.png", "app.ico", "app-test.ico", "web-access.css", "web-access.js"]
