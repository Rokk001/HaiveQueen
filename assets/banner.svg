<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="agent-orchestrator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fa8ff"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="940" cy="150" r="230" fill="url(#glow)"/>
  <!-- staff lines -->
  <g stroke="#2c3563" stroke-width="2">
    <line x1="40" y1="236" x2="1160" y2="236"/>
    <line x1="40" y1="252" x2="1160" y2="252"/>
    <line x1="40" y1="268" x2="1160" y2="268"/>
    <line x1="40" y1="284" x2="1160" y2="284"/>
    <line x1="40" y1="300" x2="1160" y2="300"/>
  </g>
  <!-- agent notes on the staff -->
  <g>
    <ellipse cx="640" cy="268" rx="11" ry="8" fill="#4fa8ff" transform="rotate(-18 640 268)"/>
    <rect x="649" y="224" width="3" height="44" fill="#4fa8ff"/>
    <ellipse cx="720" cy="252" rx="11" ry="8" fill="#c77dff" transform="rotate(-18 720 252)"/>
    <rect x="729" y="208" width="3" height="44" fill="#c77dff"/>
    <ellipse cx="800" cy="284" rx="11" ry="8" fill="#ff6fb5" transform="rotate(-18 800 284)"/>
    <rect x="809" y="240" width="3" height="44" fill="#ff6fb5"/>
    <ellipse cx="880" cy="236" rx="11" ry="8" fill="#3ddcdc" transform="rotate(-18 880 236)"/>
    <rect x="889" y="192" width="3" height="44" fill="#3ddcdc"/>
    <ellipse cx="960" cy="268" rx="11" ry="8" fill="#d7a86e" transform="rotate(-18 960 268)"/>
    <rect x="969" y="224" width="3" height="44" fill="#d7a86e"/>
  </g>
  <!-- conductor's baton: a tapered stick with a round handle and motion arcs -->
  <g transform="translate(980 70) rotate(-28)">
    <polygon points="0,-4 190,-1 190,1 0,4" fill="#f2f4ff"/>
    <ellipse cx="-4" cy="0" rx="12" ry="9" fill="url(#accent)"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 1040 120 Q 1100 60 1160 110"/>
    <path d="M 1060 150 Q 1120 100 1170 150" opacity="0.5"/>
  </g>
  <!-- title -->
  <text x="48" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#accent)">agent-orchestrator</text>
  <text x="52" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#c9d1f2">One conductor. Many AI coding agents. Few tokens.</text>
</svg>
